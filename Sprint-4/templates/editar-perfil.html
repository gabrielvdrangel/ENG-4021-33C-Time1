<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Prisma - Editar perfil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="editar-perfil.css">
</head>
<body>

    <div class="menu-lateral">
        <div class="logo">
            <span class="logo-icone">-&Delta;=</span>
            <span class="logo-texto">Prisma</span>
        </div>

        <a href="#" class="item-menu">&#8962; &nbsp; Início</a>
        <a href="#" class="item-menu">&#9906; &nbsp; Pesquisar</a>
        <a href="#" class="item-menu">&#9776; &nbsp; Filtros</a>
        <a href="#" class="item-menu">&#9744; &nbsp; Conversas</a>
        <a href="#" class="item-menu">&#9835; &nbsp; Notificações</a>
        <a href="#" class="item-menu">&#9636; &nbsp; Oportunidades</a>
        <a href="perfil.html" class="item-menu ativo">&#9786; &nbsp; Perfil</a>

        <div class="usuario-rodape">
            <div class="bolinha-pequena">B</div>
            <div>
                <p class="nome-pequeno">Beatriz Lima</p>
                <p class="curso-pequeno">Engenharia de Computa...</p>
            </div>
        </div>
        <a href="#" class="sair-menu">Sair da conta</a>
    </div>

    <div class="conteudo">
        <div class="titulo-editar">
            <a href="perfil.html" class="voltar">&lt;</a>
            <h2>Editar perfil</h2>
        </div>

        <div class="centro">
            <div class="avatar-vazio">&#9786;</div>
            <a href="#" class="editar-foto">Editar foto de perfil &#9998;</a>
        </div>

        <div class="formulario">
            <div class="campo">
                <label>Nome</label>
                <input type="text" value="Beatriz">
            </div>

            <div class="campo">
                <label>Sobrenome</label>
                <input type="text" value="Lima">
            </div>

            <div class="campo">
                <label class="label-laranja">Data de nascimento</label>
                <input type="date" value="2004-03-14">
            </div>

            <div class="campo">
                <label>Curso</label>
                <input type="text" value="Engenharia de Computação">
            </div>

            <div class="campo">
                <label>Período</label>
                <select>
                    <option>1º período</option>
                    <option>2º período</option>
                    <option>3º período</option>
                    <option>4º período</option>
                    <option selected>5º período</option>
                    <option>6º período</option>
                    <option>7º período</option>
                    <option>8º período</option>
                    <option>9º período</option>
                    <option>10º período</option>
                </select>
            </div>
        </div>

        <div class="botoes">
            <a href="perfil.html" class="botao-cancelar">Cancelar</a>
            <a href="perfil.html" class="botao-aplicar">Aplicar mudanças</a>
        </div>
    </div>

</body>
</html>
