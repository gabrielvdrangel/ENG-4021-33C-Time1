<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma - Entrar</title>
    <link rel="stylesheet" href="../static/css/tela-login.css">
</head>
<body>
    <div class="caixa">
        <a href="entrar-cadastrar.html" class="voltar">←</a>
        <img src="../static/img/logoprisma2.png" alt="Logotipo da marca Prisma, com a palavra Prisma em letras estilizadas em azul e roxo, em um fundo transparente, exibido acima do formulário de login em uma página de entrada do ambiente digital da organização" width="100px">
        <h1>Prisma</h1>
        <p>Ambiente de oportunidades online</p>
         <form action="#" method="post">

            <label for="matricula">Matrícula</label>
            <input type="text" id="matricula" name="matricula" placeholder="6 dígitos numéricos" maxlength="6" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

            <a href="#" class="esqueceu">Esqueceu a senha ou o login?</a>

            <button type="submit" class="entrar">Entrar</button>

        </form>

    </div>
</body>
</html>
