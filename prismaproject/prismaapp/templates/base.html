{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Prisma{% endblock %}</title>

    {% block extra_css %}{% endblock %}
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="site-container">
            <div class="site-navbar">
                <div>
                    <img src="{% static 'img/logoprisma2.png' %}" width="200px" alt="Prisma">
                </div>
                <nav class="site-nav" aria-label="Navegação principal">
                    <ul class="site-nav-list">
                        <li><a href="{% url 'homepage' %}">Inicio</a></li>
                        <li><a href="{% url 'conversas' %}">Mensagens</a></li>
                        <li><a href="{% url 'notificacoes' %}">Notificações</a></li>
                        <li><a href="{% url 'perfil' %}"><img src="{% static 'img/perfil.png' %}" width="30px" alt="Perfil"></a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    {% block content %}{% endblock %}
</body>
</html>
