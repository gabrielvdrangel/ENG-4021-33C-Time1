{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Prisma{% endblock %}</title>

    {% block extra_css %}{% endblock %}
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="site-container">
            <div class="site-navbar">
                <div>
                    <img src="{% static 'img/logoprisma2.png' %}" width="200px" alt="Prisma">
                </div>
                <nav class="site-nav" aria-label="Navegação principal">
                    <ul class="site-nav-list">
                        <li><a href="{% url 'homepage' %}">Inicio</a></li>
                        <li><a href="{% url 'conversas' %}">Mensagens</a></li>
                        <li><a href="{% url 'notificacoes' %}">Notificações</a></li>
                        <li><a href="{% url 'perfil' %}" class="nav-perfil" aria-label="Meu perfil">{% if user.is_authenticated and user.imagem %}<img src="{{ user.imagem.url }}" alt="Perfil">{% else %}<img src="{% static 'img/perfil.png' %}" alt="Perfil">{% endif %}</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    {% block content %}{% endblock %}

    <div id="confirmar-overlay" class="confirmar-overlay" hidden>
        <div class="confirmar-box" role="dialog" aria-modal="true" aria-labelledby="confirmar-msg">
            <p id="confirmar-msg"></p>
            <div class="confirmar-botoes">
                <button type="button" id="confirmar-cancelar" class="btn btn-outline-primary">Cancelar</button>
                <button type="button" id="confirmar-remover" class="btn btn-danger">Remover</button>
            </div>
        </div>
    </div>

    <script>
    (function () {
        var overlay = document.getElementById('confirmar-overlay');
        var msg = document.getElementById('confirmar-msg');
        var formPendente = null;

        function fechar() { overlay.hidden = true; formPendente = null; }

        // Qualquer form com data-confirmar="..." pede confirmação antes de enviar
        document.addEventListener('submit', function (e) {
            var texto = e.target.dataset.confirmar;
            if (!texto) return;
            e.preventDefault();
            formPendente = e.target;
            msg.textContent = texto;
            overlay.hidden = false;
        });

        document.getElementById('confirmar-remover').addEventListener('click', function () {
            var f = formPendente;
            fechar();
            if (f) f.submit();
        });
        document.getElementById('confirmar-cancelar').addEventListener('click', fechar);
        overlay.addEventListener('click', function (e) { if (e.target === overlay) fechar(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fechar(); });
    })();
    </script>
</body>
</html>
