{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prisma</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="{% static 'css/aluno.css' %}" rel="stylesheet" type="text/css"/>
</head>
<body>

  <form method="post" action="{% url 'cadastro_aluno' %}">
    {% csrf_token %}

    <div class="caixa">
            <img src="{% static 'img/logoprisma2.png' %}" width="100px">
            <h1>Prisma</h1>
            <p>Ambiente de oportunidades online</p>

      <div class="form-group">
        <input type="text" class="form-control" name = "nome" placeholder="Nome completo" required>
      </div>

      <div class="form-group">
        <input type="text" class="form-control" name = "login" placeholder="Matricula (7 digitos)" required>
      </div>

      <div class="form-group">
        <input type="password" class="form-control" name = "senha" placeholder="Crie uma senha" required>
      </div>

      <div class="form-group">
        <input type="email" class="form-control" name = "email" placeholder="Email" required>
      </div>

      <div class="form-group">
        <input type="text" class="form-control" name = "curso" placeholder="Curso" required>
      </div>
      
      <div class="form-group">
        <input type="number" class="form-control" name = "periodo" placeholder="Período (número)" required>
      </div>

      {% if erro %}<p class="text-danger">{{ erro }}</p>{% endif %}

      <button type="submit" class="btn btn-outline-primary">Criar Conta</button>

  </form>

    </div>

</body>
</html>
