{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Prisma - Editar perfil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/css-editarperfil.css' %}">
</head>
<body>

    <form method="post" action="{% url 'editar_perfil' %}">
    {% csrf_token %}

        <div class="conteudo">
            <div class="titulo-editar">
                <a href="{% url 'perfil' %}" class="voltar">&lt;</a>
                <h2>Editar perfil</h2>
            </div>

            <div class="centro">
                <img src="{{ usuario.image_url }}"  class="avatar"/><br>
                <a href="#" class="editar-foto">Editar foto de perfil &#9998;</a>
            </div>

            <div class="formulario">
                
                <div class="campo">
                    <label>Nome</label>
                    <input type="text" name="nome" value="{{ usuario.nome }}">
                </div>

                <div class="campo">
                    <label class="label-laranja">Data de nascimento</label>
                    <input type="date" value="2004-03-14">
                </div>

                <div class="campo">
                    <label>Curso</label>
                    <input type="text" name="curso" value="{{ usuario.curso }}">
                </div>

                <div class="campo">
                    <label>Período</label>
                    <input type="number" name="periodo" value="{{ usuario.periodo }}">
                        
                </div>
            </div>

            <div class="botoes">
                <a href="{% url 'perfil' %}" class="botao-cancelar">Cancelar</a>
                <button type="submit" class="botao-aplicar">Aplicar mudanças</button>
            </div>
        </div>
    
    </form>

</body>
</html>
