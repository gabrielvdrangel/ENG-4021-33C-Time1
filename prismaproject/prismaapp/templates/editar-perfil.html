{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Prisma - Editar perfil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/tema.css' %}">
    <link rel="stylesheet" href="{% static 'css/css-editarperfil.css' %}">
</head>
<body>

    <form method="post" action="{% url 'editar_perfil' %}" enctype="multipart/form-data">
    {% csrf_token %}

        <div class="conteudo">
            <div class="titulo-editar">
                <a href="{% url 'perfil' %}" class="voltar">&lt;</a>
                <h2>Editar perfil</h2>
            </div>

            <div class="centro">
                <img src="{% if usuario.imagem %}{{ usuario.imagem.url }}{% else %}{% static 'img/perfil.png' %}{% endif %}" class="avatar"/><br>
            </div>

            <div class="formulario">
                {% if erro %}
                    <p class="erro" style="color: #c0392b;">{{ erro }}</p>
                {% endif %}

                <div class="campo">
                    <label>Nome</label>
                    <input type="text" name="nome" value="{{ usuario.first_name }}">
                </div>

                {% if usuario.curso is not None and usuario.periodo is not None %}
                    <div class="campo">
                        <label>Curso</label>
                        <input type="text" name="curso" list="lista-cursos" value="{{ usuario.curso|default:'' }}" placeholder="Digite para pesquisar" autocomplete="off">
                        <datalist id="lista-cursos">
                            {% for curso in cursos %}
                                <option value="{{ curso.nome }}"></option>
                            {% endfor %}
                        </datalist>
                    </div>
                

                    <div class="campo">
                        <label>Período</label>
                        <input type="number" name="periodo" value="{{ usuario.periodo|default:'' }}">
                    </div>
                {% endif %}
                 <div class="campo">
                    <label>Foto de perfil</label>
                    <input type="file" name="imagem" accept="image/*">
                </div>
            </div>

            <div class="botoes">
                <a href="{% url 'perfil' %}" class="botao-cancelar">Cancelar</a>
                <button type="submit" class="botao-aplicar">Aplicar mudanças</button>
            </div>
        </div>
    
    </form>

</body>
</html>
