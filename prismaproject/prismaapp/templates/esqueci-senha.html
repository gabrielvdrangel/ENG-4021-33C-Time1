{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prisma</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="{% static 'css/senha.css' %}" rel="stylesheet" type="text/css"/>
</head>
<body>

<div class="caixa">
  <img src="{% static 'img/logoprisma2.png' %}" width="100px">
  <h1>Prisma</h1>
  <p>Ambiente de oportunidades online</p>

  <form method="post">
    {% csrf_token %}

    <label for="email" class="rotulo">Insira seu email</label>

    <div class="form-group">
      <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
    </div>

    {% if mensagem %}
      <p>{{ mensagem }}</p>
    {% endif %}

    <button type="submit" class="btn btn-outline-primary">Enviar</button>
  </form>
</div>

</body>
</html>
