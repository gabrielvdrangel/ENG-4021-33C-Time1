{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Prisma - Perfil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/css-perfil.css' %}">
</head>
<body>


    <div class="conteudo">
        <a href="{% url 'homepage' %}" class="voltar">&lt;</a>

        <div class="centro">
            <img src="{% if usuario.imagem_url %}{{ usuario.imagem_url }}{% else %}{% static 'img/avatar.png' %}{% endif %}" class="avatar"/>
            <h2 class="nome">{{ usuario.first_name|default:usuario.username }}</h2>
            {% if usuario.curso %}
                <p class="curso">{{ usuario.curso }}</p>
            {% else %}
                <p class="curso">Organização</p>
            {% endif %}

            <a href="{% url 'editar_perfil' %}" class="botao-editar">Editar perfil</a>
        </div>

        <div class="grade-cards">
    <a href="{% url 'salvos' %}" class="card">
        <span class="icone-card">&#9873;</span>
        <p>Salvos</p>
    </a>
    <a href="{% url 'candidaturas' %}" class="card">
        <span class="icone-card">&#9776;</span>
        <p>Candidaturas</p>
    </a>
    <a href="{% url 'prazos' %}" class="card">
        <span class="icone-card">&#9783;</span>
        <p>Prazos</p>
    </a>
    <a href="{% url 'realizados' %}" class="card">
        <span class="icone-card">&#10003;</span>
        <p>Realizados</p>
    </a>
</div>

        <a href="{% url 'logout' %}" class="sair-centro">Sair da conta</a>
    </div>

</body>
</html>
