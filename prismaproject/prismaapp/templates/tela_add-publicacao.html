{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <title>Prisma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="{% static 'css/add-publicacao.css' %}" />
  </head>

  <body>

    <div class="container">
      <div class="navbar">
        <div>
          <img src="{% static 'img/logoprisma2.png' %}" width="200px">
        </div>
        <nav>
          <ul>
            <li><a href="{% url 'homepage' %}">Inicio</a></li>
            <li><a href="{% url 'conversas' %}">Mensagens</a></li>
            <li><a href="{% url 'notificacoes' %}">Notificações</a></li>
            <li><a href="{% url 'perfil' %}"><img src="{% static 'img/perfil.png' %}" width="30px"></a></li>
          </ul>
        </nav>
      </div>
    </div>

    <div class="conteudo-pub">

      <a href="{% url 'homepage_org' %}" class="voltar">&lt;</a>

      <form method="post" class="card-pub">
        {% csrf_token %}

        <div class="card-pub-topo">
          <h4>Adicionar Oportunidade</h4>
          <small>Publicando como <strong>Rio Botz</strong></small>
        </div>

        <label for="nome">Nome</label>
        <input type="text" id="nome" name="Nome" class="form-control"
               maxlength="100" placeholder="Nome da oportunidade" required>

        <label for="tipo">Tipo</label>
        <input type="text" id="tipo" name="Tipo" class="form-control"
               maxlength="100" placeholder="Ex.: Estágio, Projeto, Evento" required>

        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao" class="form-control"
                  placeholder="Descreva a oportunidade..." required></textarea>

        <label for="limite_inscricao">Limite de inscrição</label>
        <input type="datetime-local" id="limite_inscricao" name="limite_inscricao"
               class="form-control" required>

        <hr>
        <div class="acoes">
          <button type="submit" class="btn btn-primary">Compartilhar</button>
        </div>

      </form>

    </div>

  </body>
</html>
