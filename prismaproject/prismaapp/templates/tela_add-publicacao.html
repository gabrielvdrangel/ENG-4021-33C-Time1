{% extends 'base.html' %}
{% load static %}

{% block title %}Adicionar oportunidade - Prisma{% endblock %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="{% static 'css/add-publicacao.css' %}" />
{% endblock %}

{% block content %}

    <div class="conteudo-pub">

      <a href="{% url 'homepage' %}" class="voltar">&lt;</a>

      <form method="post" class="card-pub" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="card-pub-topo">
          <h4>Adicionar Oportunidade</h4>
          <small>Publicando como <strong>{{ user.first_name }}</strong></small>
        </div>

        <label for="tipo">Tipo</label>
        <select id="tipo" name="tipo" class="form-control" required>
          <option value="">Selecione o tipo</option>
          <option value="evento">Evento</option>
          <option value="monitoria">Monitoria</option>
          <option value="iniciacao_cientifica">Iniciação científica</option>
          <option value="estagio">Estágio</option>
          <option value="outro">Outro</option>
        </select>

        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao" class="form-control"
                  placeholder="Descreva a oportunidade..." required></textarea>

        <label for="limite_inscricao">Limite de inscrição</label>
        <input type="datetime-local" id="limite_inscricao" name="limite_inscricao"
               class="form-control" required>
        
        <label for="imagem">Imagem (opcional)</label>
        <input type="file" id="imagem" name="imagem" class="form-control" accept="image/*">

        <hr>
        <div class="acoes">
          <button type="submit" class="btn btn-primary">Compartilhar</button>
        </div>

      </form>

    </div>

{% endblock %}
