{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prisma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="{% static 'css/PersonalizacaoChat.css' %}" />
    
  </head>


  <body>

    <div class="container">
      <div class="navbar"> 
            <div>
                <img src="{% static 'img/logoprisma2.png' %}" width="200px">
            </div>
            <nav>
              <ul>
                <li><a href="{% url 'homepage' %}">Inicio</a></li>
                <li><a href="{% url 'conversas' %}">Mensagens</a></li>
                <li><a href="{% url 'notificacoes' %}">Notificações</a></li>
                <li><a href="{% url 'perfil' %}"><img src="{% static 'img/perfil.png' %}" width="30px"></a></li>
              </ul>
            </nav>
    
    
 
        </div>
    </div>
    
    <div class="blocoprincipal">
      <div class="caixa">
         <div class="caixa">
        <a href="{% url 'conversas' %}" class="voltar" aria-label="Voltar para mensagens">
          <i class="bi bi-arrow-left"></i>
        </a>

        <div class="perfil">
        <div class="perfil">
          <img class="avatar" src="{% static 'img/EmpresaJuniorPefil.png' %}">
          <div class="info">
            <strong>Empresa Junior</strong>
            <small>Organização</small>
          </div>
        </div>

        <div class="mensagem">
          <p class="textomensagem">Você tem disponibilidade para uma conversa na quinta às 17h?</p>
        </div>


        <div class="area_interacao">
              <form class="d-flex">
                <input class="form-control me-2" type="search" placeholder="Digite sua Mensagem" aria-label="Search">
                <button class="btn btn-outline-primary"> <i class="bi bi-send-fill"></i></button>
              </form>
        </div>  

      </div>

    </div>
    </div>      

  </body>
</html>
