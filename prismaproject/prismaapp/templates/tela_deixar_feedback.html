{% extends 'base.html' %}
{% load static %}

{% block title %}Deixar feedback - Prisma{% endblock %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="{% static 'css/tema.css' %}">
<link rel="stylesheet" href="{% static 'css/padrao.css' %}">
<link rel="stylesheet" href="{% static 'css/deixar_feedback.css' %}" />
{% endblock %}

{% block content %}

    <div class="conteudo-feedback">

      <a href="{% url 'tela_feedbacks' username=org.username %}" class="voltar">&lt;</a>

      <form method="post" class="card-feedback">
        {% csrf_token %}

        <div class="card-feedback-topo">
          <h4>Deixar Feedback</h4>
          <small>Para <strong>{{ org.first_name|default:org.username }}</strong></small>
        </div>

        {% if erro %}
          <p class="erro">{{ erro }}</p>
        {% endif %}

        <label for="comentario">Comentário</label>
        <textarea id="comentario" name="comentario" class="form-control"
                  placeholder="Escreva seu feedback..." required></textarea>

        <hr>
        <div class="acoes">
          <button type="submit" class="btn btn-primary">Enviar</button>
        </div>

      </form>

    </div>

{% endblock %}
