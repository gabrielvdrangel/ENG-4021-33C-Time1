{% extends 'base.html' %}
{% load static %}

{% block title %}Editar oportunidade - Prisma{% endblock %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="{% static 'css/tema.css' %}">
<link rel="stylesheet" href="{% static 'css/padrao.css' %}">
<link rel="stylesheet" href="{% static 'css/tela_editar_publi.css' %}" />
{% endblock %}

{% block content %}
<div class="conteudo-pub">

  <a href="{% url 'prazos' %}" class="voltar">&lt;</a>

  <form method="post" class="card-pub" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="card-pub-topo">
      <h4>Editar Oportunidade</h4>
      <small>Editando como <strong>{{ user.first_name }}</strong></small>
    </div>

        <label for="descricao">Descrição</label>
    <textarea id="descricao" name="descricao" class="form-control" required>{{ post.descricao }}</textarea>

    <label for="limite_inscricao">Limite de inscrição</label>
    <input type="datetime-local" id="limite_inscricao" name="limite_inscricao" class="form-control"
           value="{{ post.limite_inscricao|date:'Y-m-d\TH:i' }}">


    <label for="imagem">Imagem (opcional)</label>
    <input type="file" id="imagem" name="imagem" class="form-control" accept="image/*">

    <hr>
    <div class="acoes">
      <a href="{% url 'prazos' %}" class="btn btn-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary">Salvar alterações</button>
    </div>

  </form>
</div>
{% endblock %}
