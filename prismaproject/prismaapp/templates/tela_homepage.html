{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <title>Prisma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="{% static 'css/PersonalizacaoHomepage.css' %}" />
    
  </head>


  <body>

      <div class="container">
        <div class="navbar"> 
            <div>
                <img src="{% static 'img/logoprisma2.png' %}" width="200px">
            </div>
            <nav>
              <ul>
                <li><a href="{% url 'homepage' %}">Inicio</a></li>
                <li><a href="{% url 'conversas' %}">Mensagens</a></li>
                <li><a href="{% url 'notificacoes' %}">Notificações</a></li>
                <li><a href="{% url 'perfil' %}"><img src="{% static 'img/perfil.png' %}" width="30px"></a></li>
              </ul>
            </nav>
    
    
 
        </div>
      </div>

      <div class="filtro">
        <div class="botoes">

            <button type="button" class="btn btn-outline-primary">Seguindo</button>
            <button type="button" class="btn btn-outline-primary">Sugestões</button>

          <div class="input-group input-group-sm busca">
            <input type="search" class="form-control" placeholder="Pesquisar no Prisma..." aria-label="Pesquisar" />
            <button type="button" class="btn btn-outline-primary" aria-label="Buscar">
            <i class="bi bi-search"></i>
            </button>
          </div>

        </div>
        </div>

    

    <div class="feed">

      {% for post in Postagens %}
      <div class="card">

        <div class="card-header d-flex align-items-center bg-white">
            <img src="{% static 'img/RioBotzPefil.png' %}"  class="avatar me-2"/>
            <div>
              <strong>{{ post.Nome }}</strong><br />
              <small>{{ post.data_publicacao }}</small>
            </div>
          </div>

          <img src="{% static 'img/RioBotzPost.png' %}" class="card-img-top"/>

          <div class="card-body">
            <p class="card-text">{{ post.descricao }}</p>
          </div>

          <div class="card-footer bg-white">
            <button class="btn btn-outline-primary"><i class="bi bi-heart-fill"></i></button>
            <button class="btn btn-outline-primary"><i class="bi bi-chat-right-fill"></i></button>
            <button class="btn btn-outline-primary"><i class="bi bi-bookmark-fill"></i></button>
          </div>
      </div>
      
      {% endfor %}

    </div>




  </body>
</html>
