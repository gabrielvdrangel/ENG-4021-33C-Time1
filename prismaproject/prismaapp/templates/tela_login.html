{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma - Entrar</title>
    <link rel="stylesheet" href="{% static 'css/tela-login.css' %}">
</head>
<body>
    <div class="caixa">
        <a href="{% url 'entrar_cadastrar' %}" class="voltar">←</a>
        <img src="{% static 'img/logoprisma2.png' %}" alt="Logotipo da marca Prisma, com a palavra Prisma em letras estilizadas em azul e roxo, em um fundo transparente, exibido acima do formulário de login em uma página de entrada do ambiente digital da organização" width="100px">
        <h1>Prisma</h1>
        <p>Ambiente de oportunidades online</p>
         <form action="{% url 'login' %}" method="post">
    {% csrf_token %}

    {% if erro %}
        <p class="erro">{{ erro }}</p>
    {% endif %}

    <label for="matricula">Matrícula</label>
    <input type="text" id="matricula" name="username" placeholder="7 dígitos numéricos" required>

    <label for="senha">Senha</label>
    <input type="password" id="senha" name="password" placeholder="Digite sua senha" required>

    <a href="{% url 'esqueci_senha' %}" class="esqueceu">Esqueceu a senha ou o login?</a>

    <button type="submit" class="entrar">Entrar</button>
</form>
    </div>
</body>
</html>
