{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <title>Prisma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="{% static 'css/tela_perfil_org.css' %}" />
  </head>

  <body>

     <div class="container">
        <div class="navbar"> 
            <div>
                <img src="{% static 'img/logoprisma2.png' %}" width="200px">
            </div>
            <nav>
              <ul>
                <li><a href="{% url 'homepage' %}">Inicio</a></li>
                <li><a href="{% url 'conversas' %}">Mensagens</a></li>
                <li><a href="{% url 'notificacoes' %}">Notificações</a></li>
                <li><a href="{% url 'perfil' %}"><img src="{% static 'img/perfil.png' %}" width="30px"></a></li>
              </ul>
            </nav>
    
    
 
        </div>
      </div>

    <div class="caixa">
        <div class="conteudo">
            <section class="avatar">
                <div class="team-logo">RioBotz</div>
                <h1>Pegaus FSAE</h1>
                <p>Equipe de competição · Automobilística</p>
                <button type="button" class="btn btn-danger">Seguindo</button>
            </section>
 
    <div class="filtro">
      <button type="button" class="btn btn-primary">Publicações</button>
      <button type="button" class="btn btn-primary">Vagas e PS</button>
      <button type="button" class="btn btn-primary">Feedbacks</button>
    </div>
 
    <div class="feed">
      {% for post in oportunidades %}
        {% if post.nome == "Pegasus FSAE" %}
          <div class="card">
            <p class="card-title">{{ post.nome }}</p>
            <img src="{{ post.imagem_url }}" class="card-img-top"/>
        <div class="card-body">
            <p class="card-text">{{ post.descricao }}</p>
            </div>

            <div class="card-footer bg-white">
              <button class="btn btn-outline-primary"><i class="bi bi-heart-fill"></i></button>
              <button class="btn btn-outline-primary"><i class="bi bi-chat-right-fill"></i></button>
              <button class="btn btn-outline-primary"><i class="bi bi-bookmark-fill"></i></button>
            </div>
          </div>
        {% endif %}
      {% endfor %}
  </body>
</html>
