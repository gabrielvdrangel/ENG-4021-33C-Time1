{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prisma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="{% static 'css/tela_perfil_org.css' %}" />
  </head>

  <body>

     <div class="container">
        <div class="navbar"> 
            <div>
                <img src="{% static 'img/logoprisma2.png' %}" width="200px">
            </div>
            <nav>
              <ul>
                <li><a href="{% url 'homepage' %}">Inicio</a></li>
                <li><a href="{% url 'conversas' %}">Mensagens</a></li>
                <li><a href="{% url 'notificacoes' %}">Notificações</a></li>
                <li><a href="{% url 'perfil' %}"><img src="{% static 'img/perfil.png' %}" width="30px"></a></li>
              </ul>
            </nav>
    
    
 
        </div>
      </div>

    <div class="caixa">
        <div class="conteudo">
            <section class="avatar">
                <div class="team-logo">
                {% if org.imagem_url %}
                <img src="{{ org.imagem_url }}" alt="{{ org.first_name }}">
                {% else %}
                <img src="https://previews.123rf.com/images/hugok1000/hugok10001905/hugok1000190500198/123291745-default-profile-avatar-illustration-in-blue-and-white-no-person.jpg" alt="{{ org.first_name }}">{% endif %}</div>
                <h1>{{ org.first_name }}</h1>
                <button type="button" class="btn btn-danger">Seguindo</button>
            </section>
 
    <div class="filtro">

      <button type="button" class="btn btn-primary">Feedbacks</button>
    </div>
 
    <div class="feed">
      {% for post in oportunidades %}
          <div class="card">
            <img src="{{ post.imagem_url }}" class="card-img-top"/>
        <div class="card-body">
            <p class="card-text">{{ post.descricao }}</p>
            </div>

            <div class="card-footer bg-white">
              <button class="btn btn-outline-primary"><i class="bi bi-heart-fill"></i></button>
              <button class="btn btn-outline-primary"><i class="bi bi-chat-right-fill"></i></button>
              <button class="btn btn-outline-primary"><i class="bi bi-bookmark-fill"></i></button>
            </div>
          </div>
      {% empty %}
        <p>Nenhuma publicação ainda.</p>
      {% endfor %}
    </div>
        </div>
    </div>
  </body>
</html>
