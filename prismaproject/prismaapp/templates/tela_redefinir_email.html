{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prisma</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="{% static 'css/senha.css' %}" rel="stylesheet" type="text/css"/>
    <link rel="stylesheet" href="{% static 'css/prisma.css' %}">
</head>
<body class="pr-auth">

<div class="caixa">
  <a href="{% url 'esqueci_senha' %}" class="voltar">←</a>
  <img src="{% static 'img/prisma_logo.png' %}" width="100px">
  <h1>Prisma</h1>
  <p>Ambiente de oportunidades online</p>

   <form method="post">
    {% csrf_token %}

    <label for="username" class="rotulo">Usuário</label>
    <div class="form-group">
      <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
    </div>

    <label for="novo_email" class="rotulo">Novo email</label>
    <div class="form-group">
      <input type="email" class="form-control" id="novo_email" name="novo_email" placeholder="Novo email" required>
    </div>

    <label for="senha" class="rotulo">Senha</label>
    <div class="form-group">
      <input type="password" class="form-control" id="senha" name="senha" placeholder="Senha" required>
    </div>

    {% if mensagem %}
      <p>{{ mensagem }}</p>
    {% endif %}

    <button type="submit" class="btn btn-outline-primary">Atualizar email</button>
  </form>
</div>

</body>
</html>
